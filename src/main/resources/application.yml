spring:
  application:
    name: aimud
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/aimud
    username: aimud
    password: aimud_password
    pool:
      initial-size: 5
      max-size: 20
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:5432/aimud
    user: aimud
    password: aimud_password
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
