<div class="item-dialog-container">
  <div class="dialog-header">
    <h2 mat-dialog-title>{{ data.item.name }}</h2>
  </div>

  <mat-dialog-content>
    <div class="item-info">
      <div class="info-row">
        <span class="info-label">Type:</span>
        <span class="info-value">{{ data.item.itemType }}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Wear Location:</span>
        <span class="info-value">{{ data.item.wearLocation }}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Value:</span>
        <span class="info-value">{{ data.item.value }}g</span>
      </div>
    </div>

    <div class="divider"></div>

    <div *ngIf="data.item.effects && data.item.effects.length > 0" class="effects-section">
      <h3 class="section-title">Effects</h3>
      <div class="effects-list">
        <div *ngFor="let effect of data.item.effects" class="effect-item">
          {{ getEffectDescription(effect) }}
        </div>
      </div>
      <div class="divider"></div>
    </div>

    <div class="stats-grid">
      <ng-container *ngFor="let key of getStatKeys()">
        <div *ngIf="hasStat(key)" class="stat-item">
          <span class="stat-label">{{ getStatLabel(key) }}:</span>
          <span [class.negative]="data.item[key] < 0" [class.positive]="data.item[key] > 0" class="stat-value">
            {{ data.item[key] > 0 ? '+' : '' }}{{ data.item[key] }}
          </span>
        </div>
      </ng-container>
    </div>

    <div *ngIf="!getStatKeys().some(hasStat.bind(this))" class="no-stats">
      No additional stats.
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button (click)="onClose()" class="ok-button" mat-button>OK</button>
  </mat-dialog-actions>
</div>
