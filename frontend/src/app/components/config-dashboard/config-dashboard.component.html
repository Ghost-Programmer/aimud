<div class="config-container">
  <!-- Server Settings -->
  <section class="config-section">
    <h2>Server Settings</h2>
    <form [formGroup]="serverSettingsForm" (ngSubmit)="saveServerSettings()">
      <div class="form-group">
        <label for="serverName">Server Name</label>
        <input type="text" id="serverName" formControlName="serverName">
      </div>
      <div class="form-group checkbox-group">
        <input type="checkbox" id="allowNewUser" formControlName="allowNewUser">
        <label for="allowNewUser">Allow New Users</label>
      </div>
      <div class="form-group checkbox-group">
        <input type="checkbox" id="maintenance" formControlName="maintenance">
        <label for="maintenance">Maintenance Mode</label>
      </div>
      <div class="form-group">
        <label for="maintenanceText">Maintenance Text</label>
        <input type="text" id="maintenanceText" formControlName="maintenanceText">
      </div>
      <div class="form-group">
        <label for="aiSystemPrompt">AI System Prompt</label>
        <textarea id="aiSystemPrompt" formControlName="aiSystemPrompt" rows="10" style="width: 100%; resize: vertical;"></textarea>
      </div>
      <button type="submit" class="btn-primary" [disabled]="serverSettingsForm.invalid">Save Settings</button>
    </form>
  </section>

  <!-- Races -->
  <section class="config-section">
    <div class="section-header">
      <h2>Races</h2>
      <button class="btn-secondary" (click)="openRaceForm()">Add Race</button>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let race of races">
            <td>{{ race.name }}</td>
            <td>{{ race.description }}</td>
            <td class="actions-cell">
              <button class="icon-btn" (click)="openRaceForm(race)" title="Edit">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-fill" viewBox="0 0 16 16">
                  <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708l-3-3zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207l6.5-6.5zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.499.499 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11l.178-.178z"/>
                </svg>
              </button>
              <button class="icon-btn delete-btn" (click)="deleteRace(race.id)" title="Delete">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
                  <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1H2.5zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5zM8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5zm3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0z"/>
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Character Classes -->
  <section class="config-section">
    <div class="section-header">
      <h2>Character Classes</h2>
      <button class="btn-secondary" (click)="openClassForm()">Add Class</button>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cls of classes">
            <td>{{ cls.name }}</td>
            <td>{{ cls.description }}</td>
            <td class="actions-cell">
              <button class="icon-btn" (click)="openClassForm(cls)" title="Edit">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-fill" viewBox="0 0 16 16">
                  <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708l-3-3zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207l6.5-6.5zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.499.499 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11l.178-.178z"/>
                </svg>
              </button>
              <button class="icon-btn delete-btn" (click)="deleteClass(cls.id)" title="Delete">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
                  <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1H2.5zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5zM8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5zm3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0z"/>
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>

<!-- Race Form Dialog -->
<div class="dialog-overlay" *ngIf="isRaceFormVisible">
  <div class="dialog-content">
    <h2>{{ selectedRace ? 'Edit' : 'Add' }} Race</h2>
    <form [formGroup]="raceForm" (ngSubmit)="saveRace()">
      <div class="form-group">
        <label for="raceName">Name</label>
        <input type="text" id="raceName" formControlName="name">
      </div>
      <div class="form-group">
        <label for="raceDesc">Description</label>
        <textarea id="raceDesc" formControlName="description"></textarea>
      </div>
      <div class="stats-grid">
        <div class="form-group"><label>STR Mod</label><input type="number" formControlName="strengthMod"></div>
        <div class="form-group"><label>DEX Mod</label><input type="number" formControlName="dexterityMod"></div>
        <div class="form-group"><label>CON Mod</label><input type="number" formControlName="constitutionMod"></div>
        <div class="form-group"><label>INT Mod</label><input type="number" formControlName="intelligenceMod"></div>
        <div class="form-group"><label>WIS Mod</label><input type="number" formControlName="wisdomMod"></div>
        <div class="form-group"><label>CHA Mod</label><input type="number" formControlName="charismaMod"></div>
      </div>
      <div class="dialog-actions">
        <button type="button" (click)="closeRaceForm()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="raceForm.invalid">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Class Form Dialog -->
<div class="dialog-overlay" *ngIf="isClassFormVisible">
  <div class="dialog-content">
    <h2>{{ selectedClass ? 'Edit' : 'Add' }} Class</h2>
    <form [formGroup]="classForm" (ngSubmit)="saveClass()">
      <div class="form-group">
        <label for="className">Name</label>
        <input type="text" id="className" formControlName="name">
      </div>
      <div class="form-group">
        <label for="classDesc">Description</label>
        <textarea id="classDesc" formControlName="description"></textarea>
      </div>
      <div class="stats-grid">
        <div class="form-group"><label>STR Mod</label><input type="number" formControlName="strengthMod"></div>
        <div class="form-group"><label>DEX Mod</label><input type="number" formControlName="dexterityMod"></div>
        <div class="form-group"><label>CON Mod</label><input type="number" formControlName="constitutionMod"></div>
        <div class="form-group"><label>INT Mod</label><input type="number" formControlName="intelligenceMod"></div>
        <div class="form-group"><label>WIS Mod</label><input type="number" formControlName="wisdomMod"></div>
        <div class="form-group"><label>CHA Mod</label><input type="number" formControlName="charismaMod"></div>
      </div>
      <div class="dialog-actions">
        <button type="button" (click)="closeClassForm()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="classForm.invalid">Save</button>
      </div>
    </form>
  </div>
</div>
