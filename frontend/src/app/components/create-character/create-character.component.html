<div class="create-character-container">
  <form [formGroup]="characterForm" (ngSubmit)="saveCharacter()">
    <div class="form-group">
      <label for="name">Character Name</label>
      <input type="text" id="name" formControlName="name">
    </div>

    <div class="form-group">
      <label for="race">Race</label>
      <select id="race" formControlName="raceId">
        <option [ngValue]="null" disabled>Select a Race</option>
        <option *ngFor="let race of races" [ngValue]="race.id" [title]="race.description">{{ race.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="class">Class</label>
      <select id="class" formControlName="classId">
        <option [ngValue]="null" disabled>Select a Class</option>
        <option *ngFor="let cls of classes" [ngValue]="cls.id" [title]="cls.description">{{ cls.name }}</option>
      </select>
    </div>
  </form>

  <div class="stats-container">
    <div class="stat-item">
      <span class="stat-label">Strength</span>
      <span class="stat-value">{{ stats.strength }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Dexterity</span>
      <span class="stat-value">{{ stats.dexterity }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Constitution</span>
      <span class="stat-value">{{ stats.constitution }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Intelligence</span>
      <span class="stat-value">{{ stats.intelligence }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Wisdom</span>
      <span class="stat-value">{{ stats.wisdom }}</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Charisma</span>
      <span class="stat-value">{{ stats.charisma }}</span>
    </div>
  </div>

  <div class="actions">
    <button class="icon-btn" (click)="rollStats()" title="Roll Stats">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-dice-5-fill" viewBox="0 0 16 16">
        <path d="M3 0a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V3a3 3 0 0 0-3-3H3zm1 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm8 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zM8 8a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm4 2.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zM4 10.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
      </svg>
    </button>
    <button class="save-btn" (click)="saveCharacter()" [disabled]="characterForm.invalid">Save Character</button>
  </div>
</div>
