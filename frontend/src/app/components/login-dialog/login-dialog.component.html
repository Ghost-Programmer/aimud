<div class="dialog-overlay">
  <div class="dialog-content">
    <h2>Login</h2>
    <form (ngSubmit)="onSubmit()" [formGroup]="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username">Username</label>
        <input autocapitalize="off" autocomplete="off" autocorrect="off" formControlName="username" id="username"
               spellcheck="false" type="text">
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="error">
          Username is required
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input autocomplete="new-password" formControlName="password" id="password" type="password">
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">
          Password is required
        </div>
      </div>
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
      <div class="dialog-actions">
        <button (click)="onCancel()" type="button">Cancel</button>
        <button [disabled]="loginForm.invalid" type="submit">Login</button>
      </div>
    </form>
  </div>
</div>
