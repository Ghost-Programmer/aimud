<div class="dialog-overlay">
  <div class="dialog-content">
    <h2>Create New User</h2>
    <form (ngSubmit)="onSubmit()" [formGroup]="registerForm" autocomplete="off">
      <div class="form-group">
        <label for="username">Username</label>
        <input formControlName="username" id="username" type="text" autocomplete="new-username" data-lpignore="true">
        <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="error">
          Username is required
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input formControlName="password" id="password" type="password" autocomplete="new-password" data-lpignore="true">
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="error">
          Password is required
        </div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input formControlName="confirmPassword" id="confirmPassword" type="password" autocomplete="new-password" data-lpignore="true">
        <div *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched" class="error">
          Passwords do not match
        </div>
      </div>
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
      <div class="dialog-actions">
        <button (click)="onCancel()" type="button">Cancel</button>
        <button [disabled]="registerForm.invalid" type="submit">Register</button>
      </div>
    </form>
  </div>
</div>
