<div class="dialog-overlay" [style.display]="isOpen ? 'flex' : 'none'">
  <div class="dialog-content ai-dialog-container">
    <div class="ai-dialog-header">
      <h2>AI Assistant</h2>
      <button class="close-btn" (click)="closeDialog()">×</button>
    </div>
    <div class="ai-dialog-messages" #scrollContainer>
      <div *ngFor="let message of messages" class="message" [ngClass]="'message-' + message.role">
        <div class="message-bubble">
          <span class="message-role">{{ message.role === 'user' ? 'You' : 'AI' }}</span>
          <p>{{ message.text }}</p>
        </div>
      </div>
      <div *ngIf="isLoading" class="message message-ai">
        <div class="message-bubble">
          <span class="message-role">AI</span>
          <p class="typing-indicator">...</p>
        </div>
      </div>
    </div>
    <div class="ai-dialog-actions">
      <textarea
        [(ngModel)]="prompt"
        (keydown.enter)="sendMessage(); $event.preventDefault()"
        placeholder="Type your message..."
        [disabled]="isLoading"
      ></textarea>
      <div class="dialog-actions">
        <button type="button" class="clear-btn" (click)="clearHistory()" [disabled]="messages.length === 0 || isLoading">Clear</button>
        <div class="spacer"></div>
        <button type="button" (click)="closeDialog()">Close</button>
        <button type="submit" (click)="sendMessage()" [disabled]="isLoading || !prompt.trim()">Send</button>
      </div>
    </div>
  </div>
</div>
