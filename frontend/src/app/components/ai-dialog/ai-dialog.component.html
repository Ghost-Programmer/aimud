<div [style.display]="isOpen ? 'flex' : 'none'" class="dialog-overlay">
  <div class="dialog-content ai-dialog-container">
    <div class="ai-dialog-header">
      <h2>AI Assistant</h2>
      <button (click)="closeDialog()" class="close-btn">×</button>
    </div>
    <div #scrollContainer (scroll)="onScroll()" class="ai-dialog-messages">
      <div *ngFor="let message of messages" [ngClass]="'message-' + message.role" class="message">
        <div class="message-bubble">
          <span class="message-role">{{ message.role === 'user' ? 'You' : 'AI' }}</span>
          <p>{{ message.text }}</p>
        </div>
      </div>
      <div *ngIf="isLoading" class="message message-ai">
        <div class="message-bubble">
          <span class="message-role">AI</span>
          <p class="typing-indicator">...</p>
        </div>
      </div>
    </div>
    <div class="ai-dialog-actions">
      <textarea
        (keydown.enter)="sendMessage(); $event.preventDefault()"
        [(ngModel)]="prompt"
        [disabled]="isLoading"
        placeholder="Type your message..."
      ></textarea>
      <div class="dialog-actions">
        <button (click)="clearHistory()" [disabled]="messages.length === 0 || isLoading" class="clear-btn"
                type="button">Clear
        </button>
        <div class="spacer"></div>
        <button (click)="closeDialog()" type="button">Close</button>
        <button (click)="sendMessage()" [disabled]="isLoading || !prompt.trim()" type="submit">Send</button>
      </div>
    </div>
  </div>
</div>
