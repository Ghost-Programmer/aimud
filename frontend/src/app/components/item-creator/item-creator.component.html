<div class="item-creator-container">
  <div class="filters-bar">
    <div class="filter-group">
      <input (ngModelChange)="onSearch()" [(ngModel)]="filters.name" class="search-input" placeholder="Search by name..."
             type="text">
    </div>

    <div class="filter-group">
      <select (change)="onSearch()" [(ngModel)]="filters.type" class="filter-select">
        <option value="">All Types</option>
        <option *ngFor="let type of itemTypes" [value]="type">{{ type }}</option>
      </select>
    </div>

    <div class="filter-group">
      <select (change)="onSearch()" [(ngModel)]="filters.location" class="filter-select">
        <option value="">All Locations</option>
        <option *ngFor="let loc of wearLocations" [value]="loc">{{ loc }}</option>
      </select>
    </div>

    <div class="filter-group cost-filters">
      <input (ngModelChange)="onSearch()" [(ngModel)]="filters.minValue" class="cost-input" placeholder="Min Cost"
             type="number">
      <input (ngModelChange)="onSearch()" [(ngModel)]="filters.maxValue" class="cost-input" placeholder="Max Cost"
             type="number">
    </div>

    <button (click)="loadItems()" class="refresh-btn">&#x21bb;</button>
    <button (click)="openCreateDialog()" class="create-btn">+ New Item</button>
  </div>

  <div class="table-container">
    <table class="items-table">
      <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Location</th>
        <th>Cost</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr (click)="editItem(item)" *ngFor="let item of items" class="clickable-row">
        <td>{{ item.name }}</td>
        <td>{{ item.itemType }}</td>
        <td>{{ item.wearLocation }}</td>
        <td class="gold-text">{{ item.value }}g</td>
        <td>
          <button (click)="deleteItem(item, $event)" class="icon-btn delete-btn" title="Delete">
            <svg class="bi bi-trash-fill" fill="currentColor" height="16" viewBox="0 0 16 16" width="16"
                 xmlns="http://www.w3.org/2000/svg">
              <path
                d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1H2.5zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5zM8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5zm3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0z"/>
            </svg>
          </button>
        </td>
      </tr>
      <tr *ngIf="items.length === 0">
        <td class="no-results" colspan="5">No items found matching your criteria.</td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <button (click)="prevPage()" [disabled]="page === 0" class="pag-btn">Previous</button>
    <span class="page-info">Page {{ page + 1 }} of {{ Math.ceil(totalItems / size) || 1 }} ({{ totalItems }}
      total)</span>
    <button (click)="nextPage()" [disabled]="(page + 1) * size >= totalItems" class="pag-btn">Next</button>
  </div>

  <app-item-dialog
    (cancelDialog)="onCancelDialog()"
    (saveItem)="onSaveItem($event)"
    *ngIf="showDialog"
    [itemData]="selectedItem">
  </app-item-dialog>
</div>
