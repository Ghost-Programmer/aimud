<div class="panel">
  <div class="panel-header">
    <h2>Effects</h2>
    <div class="spacer"></div>
    <button (click)="refresh()" [disabled]="isLoading" class="btn">Refresh</button>
    <button (click)="newEffect()" class="btn primary">New Effect</button>
  </div>

  <div class="filters">
    <input (ngModelChange)="page=0; load()" [(ngModel)]="nameFilter" class="input" placeholder="Search name..."
           type="text">
    <select (ngModelChange)="page=0; load()" [(ngModel)]="typeFilter" class="input">
      <option [ngValue]="undefined">All Types</option>
      <option *ngFor="let t of effectTypes" [ngValue]="t">{{ t }}</option>
    </select>
    <select (ngModelChange)="page=0; load()" [(ngModel)]="sort" class="input">
      <option value="effectType">Sort by Type</option>
      <option value="name">Sort by Name</option>
      <option value="id">Sort by ID</option>
    </select>
  </div>

  <div class="table-wrapper">
    <table class="table">
      <thead>
      <tr>
        <th style="width:72px;">ID</th>
        <th style="width:220px;">Name</th>
        <th>Effect Type</th>
        <th>Mod1</th>
        <th>Mod2</th>
        <th>Mod3</th>
        <th>Mod4</th>
      </tr>
      </thead>
      <tbody>
      <tr (click)="edit(e)" *ngFor="let e of effects">
        <td>{{ e.id }}</td>
        <td>{{ e.name || '-' }}</td>
        <td>{{ e.effectType }}</td>
        <td>{{ e.modifier1 }}</td>
        <td>{{ e.modifier2 }}</td>
        <td>{{ e.modifier3 }}</td>
        <td>{{ e.modifier4 }}</td>
      </tr>
      <tr *ngIf="!isLoading && effects.length === 0">
        <td class="empty" colspan="7">No effects found</td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <button (click)="prevPage()" [disabled]="!canPrev()" class="btn">Prev</button>
    <span>Page {{ page + 1 }} / {{ pageCount() }}</span>
    <button (click)="nextPage()" [disabled]="!canNext()" class="btn">Next</button>
  </div>

  <app-effect-dialog (cancelDialog)="onDialogCancel()"
                     (saveEffect)="onDialogSave($event)"
                     *ngIf="showDialog"
                     [effectData]="editingEffect"></app-effect-dialog>
</div>
