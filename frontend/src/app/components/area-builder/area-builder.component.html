<div class="area-builder-container">
  <div class="prompt-section">
    <label for="aiPrompt">AI World Builder Prompt</label>
    <textarea
      id="aiPrompt"
      [(ngModel)]="prompt"
      placeholder="Describe the area, rooms, or items you want the AI to create..."
      [disabled]="isLoading"
    ></textarea>
    <div class="actions">
      <button class="admin-btn" (click)="sendPrompt()" [disabled]="isLoading || !prompt.trim()">
        <span *ngIf="!isLoading">Send to AI</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>
    </div>
  </div>

  <div *ngIf="aiResponse || isLoading" class="response-section">
    <h3>AI Response</h3>
    <div class="response-content" [class.loading]="isLoading">
      <p *ngIf="!isLoading">{{ aiResponse }}</p>
      <div *ngIf="isLoading" class="loading-message">
        AI is processing your request and building the world...
      </div>
    </div>
  </div>
</div>
