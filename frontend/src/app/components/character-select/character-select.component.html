<div class="character-list-container">
  <h2>Select a Character</h2>
  <div class="character-grid">
    <div *ngFor="let character of characters" class="character-card" (click)="selectCharacter(character)">
      <h3>{{ character.name }}</h3>
      <div class="stats-preview">
        <span>STR: {{ character.strength }}</span>
        <span>DEX: {{ character.dexterity }}</span>
        <span>CON: {{ character.constitution }}</span>
        <span>INT: {{ character.intelligence }}</span>
        <span>WIS: {{ character.wisdom }}</span>
        <span>CHA: {{ character.charisma }}</span>
      </div>
    </div>
    <div *ngIf="characters.length === 0" class="no-characters">
      <p>No characters found. Create one to get started!</p>
    </div>
  </div>
</div>
