<div (click)="onCancel()" class="dialog-overlay">
  <div (click)="$event.stopPropagation()" class="dialog-container">
    <h2>{{ editRoom.id ? 'Edit Room' : 'Create New Room' }}</h2>

    <div class="form-content">
      <div class="form-group">
        <label for="name">Name</label>
        <input [(ngModel)]="editRoom.name" class="form-input" id="name" placeholder="Room name" type="text">
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea [(ngModel)]="editRoom.description" class="form-input" id="description" placeholder="Room description"
                  rows="4"></textarea>
      </div>

      <div class="form-group">
        <label for="roomType">Room Type</label>
        <select [(ngModel)]="editRoom.roomType" class="form-input" id="roomType">
          <option *ngFor="let type of roomTypes" [value]="type">{{ type }}</option>
        </select>
      </div>

      <div class="exits-section">
        <h3>Exits & Doors</h3>
        <div class="exits-grid">
          <div class="exit-row header">
            <div class="dir">Direction</div>
            <div class="dest">Destination ID</div>
            <div class="door">Door?</div>
            <div class="open">Open?</div>
          </div>

          <!-- North -->
          <div class="exit-row">
            <div class="dir">North</div>
            <div class="dest"><input [(ngModel)]="editRoom.northId" class="form-input small" type="number"></div>
            <div class="door"><input [(ngModel)]="editRoom.northDoor" type="checkbox"></div>
            <div class="open"><input [(ngModel)]="editRoom.northDoorOpen" type="checkbox"></div>
          </div>

          <!-- South -->
          <div class="exit-row">
            <div class="dir">South</div>
            <div class="dest"><input [(ngModel)]="editRoom.southId" class="form-input small" type="number"></div>
            <div class="door"><input [(ngModel)]="editRoom.southDoor" type="checkbox"></div>
            <div class="open"><input [(ngModel)]="editRoom.southDoorOpen" type="checkbox"></div>
          </div>

          <!-- East -->
          <div class="exit-row">
            <div class="dir">East</div>
            <div class="dest"><input [(ngModel)]="editRoom.eastId" class="form-input small" type="number"></div>
            <div class="door"><input [(ngModel)]="editRoom.eastDoor" type="checkbox"></div>
            <div class="open"><input [(ngModel)]="editRoom.eastDoorOpen" type="checkbox"></div>
          </div>

          <!-- West -->
          <div class="exit-row">
            <div class="dir">West</div>
            <div class="dest"><input [(ngModel)]="editRoom.westId" class="form-input small" type="number"></div>
            <div class="door"><input [(ngModel)]="editRoom.westDoor" type="checkbox"></div>
            <div class="open"><input [(ngModel)]="editRoom.westDoorOpen" type="checkbox"></div>
          </div>

          <!-- Up -->
          <div class="exit-row">
            <div class="dir">Up</div>
            <div class="dest"><input [(ngModel)]="editRoom.upId" class="form-input small" type="number"></div>
            <div class="door"><input [(ngModel)]="editRoom.upDoor" type="checkbox"></div>
            <div class="open"><input [(ngModel)]="editRoom.upDoorOpen" type="checkbox"></div>
          </div>

          <!-- Down -->
          <div class="exit-row">
            <div class="dir">Down</div>
            <div class="dest"><input [(ngModel)]="editRoom.downId" class="form-input small" type="number"></div>
            <div class="door"><input [(ngModel)]="editRoom.downDoor" type="checkbox"></div>
            <div class="open"><input [(ngModel)]="editRoom.downDoorOpen" type="checkbox"></div>
          </div>
        </div>
      </div>

      <div class="items-section">
        <h3>Items in Room</h3>
        <div class="item-selection">
          <select (change)="onSelectItemIdChange($event)" [ngModel]="selectedItemId" class="form-input">
            <option [value]="null">-- Select an item to add --</option>
            <option *ngFor="let item of availableItems" [value]="item.id">
              {{ item.name }} ({{ item.itemType }})
            </option>
          </select>
          <button (click)="addSelectedItem()" [disabled]="!selectedItemId" class="add-btn">Add</button>
        </div>
        <div class="items-list">
          <div *ngFor="let item of currentRoomItems; let i = index" class="item-tag">
            <span>{{ item.name }}</span>
            <button (click)="removeItem(i)" class="remove-btn">×</button>
          </div>
          <div *ngIf="currentRoomItems.length === 0" class="empty-list">No items in this room.</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button (click)="onCancel()" class="cancel-btn">Cancel</button>
      <button (click)="onSave()" class="save-btn">Save</button>
    </div>
  </div>
</div>
