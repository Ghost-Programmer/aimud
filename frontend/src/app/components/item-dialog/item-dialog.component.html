<div (click)="cancel()" class="dialog-overlay">
  <div (click)="$event.stopPropagation()" class="dialog-container">
    <h2>{{ item.id ? 'Edit Item' : 'Create New Item' }}</h2>

    <div class="form-content">
      <div class="form-group">
        <label for="name">Name</label>
        <input [(ngModel)]="item.name" class="form-input" id="name" placeholder="Item Name">
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea [(ngModel)]="item.description" class="form-input" id="description" placeholder="Item Description"
                  rows="3"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="type">Item Type</label>
          <select [(ngModel)]="item.itemType" class="form-input" id="type">
            <option *ngFor="let type of itemTypes" [ngValue]="type">{{ type }}</option>
          </select>
        </div>
        <div class="form-group half">
          <label for="location">Wear Location</label>
          <select [(ngModel)]="item.wearLocation" class="form-input" id="location">
            <option *ngFor="let loc of wearLocations" [ngValue]="loc">{{ loc }}</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input [(ngModel)]="item.noPickup" name="noPickup" type="checkbox">
            No Pickup (item cannot be taken from the room)
          </label>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="property1">Property 1</label>
          <input [(ngModel)]="item.property1" class="form-input" id="property1" type="number">
        </div>
        <div class="form-group half">
          <label for="property2">Property 2</label>
          <input [(ngModel)]="item.property2" class="form-input" id="property2" type="number">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="property3">Property 3</label>
          <input [(ngModel)]="item.property3" class="form-input" id="property3" type="number">
        </div>
        <div class="form-group half">
          <label for="property4">Property 4</label>
          <input [(ngModel)]="item.property4" class="form-input" id="property4" type="number">
        </div>
      </div>

      <div class="effects-section">
        <h3>Effects</h3>

        <div class="add-effect-row">
          <select [(ngModel)]="selectedEffectId" class="form-input effect-select">
            <option [ngValue]="null">Select an Effect...</option>
            <option *ngFor="let effect of availableEffects" [ngValue]="effect.id">
              {{ effect.name || (effect.effectType + ' (' + effect.modifier1 + ')') }}
            </option>
          </select>
          <button (click)="addSelectedEffect()" [disabled]="!selectedEffectId" class="add-btn">Add</button>
        </div>

        <div class="effect-list">
          <div *ngFor="let effect of item.effects; let i = index" class="effect-item-row">
            <div class="effect-info">
              <span class="effect-name">{{ effect.name || effect.effectType }}</span>
              <span class="effect-details">
                {{ effect.effectType }}
                {{ effect.modifier1 ? '(' + effect.modifier1 + ')' : '' }}
                {{ effect.modifier2 ? ' d' + effect.modifier2 : '' }}
              </span>
            </div>
            <button (click)="removeEffect(i)" class="remove-btn" title="Remove">×</button>
          </div>
          <div *ngIf="item.effects.length === 0" class="no-effects">
            No effects added.
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button (click)="cancel()" class="cancel-btn">Cancel</button>
      <button (click)="save()" class="save-btn">Save</button>
    </div>
  </div>
</div>
