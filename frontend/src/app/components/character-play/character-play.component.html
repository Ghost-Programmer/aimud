<div class="play-container">
  <h2>Playing as {{ character.name }}</h2>
  <div class="stats-panel">
    <div class="stat">STR: {{ character.strength }}</div>
    <div class="stat">DEX: {{ character.dexterity }}</div>
    <div class="stat">CON: {{ character.constitution }}</div>
    <div class="stat">INT: {{ character.intelligence }}</div>
    <div class="stat">WIS: {{ character.wisdom }}</div>
    <div class="stat">CHA: {{ character.charisma }}</div>
  </div>
  <div class="game-area">
    <p>Game content will go here...</p>
  </div>
</div>
