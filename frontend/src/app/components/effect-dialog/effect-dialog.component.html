<div (click)="cancel()" class="dialog-overlay">
  <div (click)="$event.stopPropagation()" class="dialog-container">
    <h2>{{ effect.id ? 'Edit Effect' : 'Create New Effect' }}</h2>

    <div class="form-content">
      <div class="form-group">
        <label for="name">Name (optional)</label>
        <input [(ngModel)]="effect.name" class="form-input" id="name" placeholder="Effect name" type="text">
      </div>

      <div class="form-group">
        <label for="effectType">Effect Type</label>
        <select [(ngModel)]="effect.effectType" class="form-input" id="effectType">
          <option *ngFor="let t of effectTypes" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div class="grid">
        <div class="form-group">
          <label for="mod1">Modifier 1</label>
          <input [(ngModel)]="effect.modifier1" class="form-input small" id="mod1" type="number">
        </div>
        <div class="form-group">
          <label for="mod2">Modifier 2</label>
          <input [(ngModel)]="effect.modifier2" class="form-input small" id="mod2" type="number">
        </div>
        <div class="form-group">
          <label for="mod3">Modifier 3</label>
          <input [(ngModel)]="effect.modifier3" class="form-input small" id="mod3" type="number">
        </div>
        <div class="form-group">
          <label for="mod4">Modifier 4</label>
          <input [(ngModel)]="effect.modifier4" class="form-input small" id="mod4" type="number">
        </div>
      </div>
    </div>

    <div class="actions">
      <button (click)="cancel()" class="cancel-btn">Cancel</button>
      <button (click)="save()" class="save-btn">Save</button>
    </div>
  </div>
</div>
