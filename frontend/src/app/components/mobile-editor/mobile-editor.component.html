<div class="mobile-editor-container">

  <!-- Left Panel: List of Mobiles -->
  <div class="list-panel">
    <div class="panel-header">
      <h3>Mobiles</h3>
      <button (click)="createNew()" class="btn-create">+ New</button>
    </div>
    <ul class="mobile-list">
      <li (click)="selectMobile(m)"
          *ngFor="let m of mobiles"
          [class.selected]="selectedMobile?.id === m.id">
        <span class="mobile-name">{{ m.name }}</span>
        <button (click)="deleteMobile(m); $event.stopPropagation()" class="btn-delete">×</button>
      </li>
    </ul>
  </div>

  <!-- Right Panel: Editor -->
  <div *ngIf="mobileForm" class="editor-panel">
    <h3 *ngIf="!selectedMobile">Create New Mobile</h3>
    <h3 *ngIf="selectedMobile">Edit {{ selectedMobile.name }}</h3>

    <form (ngSubmit)="save()" [formGroup]="mobileForm">
      <div class="editor-columns">
        <!-- Column 1: Basic Info, Stats & Skills -->
        <div class="editor-column">
          <div class="form-section">
            <h4>Basic Info</h4>
            <div class="form-row">
              <label>Name</label>
              <input formControlName="name"/>
            </div>
            <div class="form-row">
              <label>Starting Room ID</label>
              <input formControlName="currentRoomId" type="number"/>
            </div>
            <div class="form-row">
              <label>Race</label>
              <app-searchable-dropdown
                formControlName="raceId"
                [options]="availableRaces"
                bindLabel="name"
                bindValue="id"
                [displayFn]="raceDisplayFn"
                placeholder="Select Race...">
              </app-searchable-dropdown>
            </div>
            <div class="form-row">
              <label>Class</label>
              <app-searchable-dropdown
                formControlName="classId"
                [options]="availableClasses"
                bindLabel="name"
                bindValue="id"
                [displayFn]="classDisplayFn"
                placeholder="Select Class...">
              </app-searchable-dropdown>
            </div>
          </div>

          <div class="form-section">
            <h4>Stats & Vitals</h4>
            <div class="stats-grid">
              <div><label>HP</label><input formControlName="currentHp" type="number"/></div>
              <div><label>Mana</label><input formControlName="currentMana" type="number"/></div>
              <div><label>STR</label><input formControlName="strength" type="number"/></div>
              <div><label>DEX</label><input formControlName="dexterity" type="number"/></div>
              <div><label>CON</label><input formControlName="constitution" type="number"/></div>
              <div><label>INT</label><input formControlName="intelligence" type="number"/></div>
              <div><label>WIS</label><input formControlName="wisdom" type="number"/></div>
              <div><label>CHA</label><input formControlName="charisma" type="number"/></div>
            </div>
          </div>

          <div class="form-section">
            <h4>Skills</h4>
            <div formArrayName="skills">
              <div *ngFor="let skill of skillsControls.controls; let i=index" [formGroupName]="i" class="array-row">
                <div style="flex-grow: 1;">
                  <app-searchable-dropdown
                    formControlName="name"
                    [options]="availableSkills"
                    bindLabel="name"
                    bindValue="name"
                    placeholder="Select Skill...">
                  </app-searchable-dropdown>
                </div>
                <input formControlName="rank" min="1" placeholder="Rank" type="number"/>
                <button (click)="removeSkill(i)" class="btn-remove" type="button">×</button>
              </div>
            </div>
            <button (click)="addSkill()" class="btn-add" type="button">Add Skill</button>
          </div>

          <div class="form-section">
            <h4>Factions</h4>
            <div class="form-row">
              <label>Primary Faction</label>
              <select formControlName="factionId">
                <option [ngValue]="null">No Faction</option>
                <option *ngFor="let faction of factions" [ngValue]="faction.id">{{ faction.name }}</option>
              </select>
            </div>
            
            <div class="faction-reputation mt-3" *ngIf="factions.length > 0">
              <h5>Faction Reputations (1-100)</h5>
              <div class="stats-grid">
                <div *ngFor="let faction of factions">
                  <label [title]="faction.description">{{ faction.name }}</label>
                  <input type="number" min="1" max="100" 
                         [ngModel]="factionRatings[faction.id] || 50" 
                         (ngModelChange)="factionRatings[faction.id] = $event" 
                         [ngModelOptions]="{standalone: true}"/>
                </div>
              </div>
            </div>
          </div>
          <div class="form-section">
            <h4>Behaviors & Modifiers</h4>
            <div class="stats-grid">
              <div>
                <label>Will Follow</label>
                <input formControlName="willFollow" type="checkbox" />
              </div>
              <div>
                <label>Will Loot</label>
                <input formControlName="willLoot" type="checkbox" />
              </div>
              <div>
                <label>Uses AI</label>
                <input formControlName="usesAi" type="checkbox" />
              </div>
              <div>
                <label>Non-Combat</label>
                <input formControlName="nonCombat" type="checkbox" />
              </div>
              <div>
                <label>Hate Healer</label>
                <input formControlName="hateHealer" type="checkbox" />
              </div>
              <div>
                <label>Hate Debuffer</label>
                <input formControlName="hateDebuffer" type="checkbox" />
              </div>
              <div>
                <label>Hate Wizard</label>
                <input formControlName="hateWizard" type="checkbox" />
              </div>
              <div>
                <label>Hate Cleric</label>
                <input formControlName="hateCleric" type="checkbox" />
              </div>
              <div>
                <label>Hate Singer</label>
                <input formControlName="hateSinger" type="checkbox" />
              </div>
            </div>
          </div>
        </div>

        <!-- Column 2: Equipment & Inventory -->
        <div class="editor-column">
          <div class="form-section">
            <h4>Equipment</h4>
            <div class="equipment-grid">
              <div *ngFor="let loc of wearLocations" class="equip-row">
                <label>{{ loc }}</label>
                <app-searchable-dropdown
                  [formControlName]="loc.toLowerCase().replace('_', '') + 'Id'"
                  [options]="getEquipItems(loc)"
                  bindValue="id"
                  [displayFn]="itemDisplayFn"
                  [showNoneOption]="true">
                </app-searchable-dropdown>
              </div>
            </div>
          </div>

          <div class="form-section">
            <h4>Inventory</h4>
            <div formArrayName="inventory">
              <div *ngFor="let inv of inventoryControls.controls; let i=index" [formGroupName]="i" class="array-row">
                <input [(ngModel)]="invSearchTexts[i]" [ngModelOptions]="{standalone: true}" class="search-input" placeholder="Search item..."
                       type="text"/>
                <select formControlName="id">
                  <option [ngValue]="null">Select Item</option>
                  <option *ngFor="let item of getFilteredInvItems(i)" [ngValue]="item.id">
                    {{ item.name }} ({{ item.id }})
                  </option>
                </select>
                <button (click)="removeInventoryItem(i)" class="btn-remove" type="button">×</button>
              </div>
            </div>
            <button (click)="addInventoryItem()" class="btn-add" type="button">Add Item</button>
          </div>
        </div>
      </div>

      <div class="form-section mt-3" *ngIf="mobileForm.get('usesAi')?.value">
        <h4>AI Configuration (Available Actions)</h4>
        <div formArrayName="actions">
          <div *ngFor="let aiAction of actionsControls.controls; let i=index" [formGroupName]="i" class="array-row" style="margin-bottom: 10px;">
            <input formControlName="description" placeholder="AI Option Description (e.g. 'Greet the player')" type="text" style="flex: 2" />
            <input formControlName="actionCommand" placeholder="MUD Command (e.g. 'say Hello!')" type="text" style="flex: 2" />
            <button (click)="removeAction(i)" class="btn-remove" type="button">×</button>
          </div>
        </div>
        <button (click)="addAction()" class="btn-add" type="button" style="margin-top: 5px;">Add Option</button>
      </div>

      <div class="form-actions">
        <button [disabled]="mobileForm.invalid" class="btn-save" type="submit">Save Mobile</button>
      </div>
    </form>
  </div>
</div>
