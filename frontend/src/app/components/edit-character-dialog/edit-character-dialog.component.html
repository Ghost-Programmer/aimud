<div class="dialog-overlay">
  <div class="dialog-content">
    <h2>Edit Character</h2>
    <form [formGroup]="characterForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" formControlName="name">
      </div>

      <div class="form-group">
        <label for="race">Race</label>
        <select id="race" formControlName="raceId">
          <option [ngValue]="null" disabled>Select a Race</option>
          <option *ngFor="let race of races" [ngValue]="race.id" [title]="race.description">{{ race.name }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="class">Class</label>
        <select id="class" formControlName="classId">
          <option [ngValue]="null" disabled>Select a Class</option>
          <option *ngFor="let cls of classes" [ngValue]="cls.id" [title]="cls.description">{{ cls.name }}</option>
        </select>
      </div>

      <div class="stats-grid">
        <div class="form-group">
          <label for="strength">STR</label>
          <input type="number" id="strength" formControlName="strength">
        </div>
        <div class="form-group">
          <label for="dexterity">DEX</label>
          <input type="number" id="dexterity" formControlName="dexterity">
        </div>
        <div class="form-group">
          <label for="constitution">CON</label>
          <input type="number" id="constitution" formControlName="constitution">
        </div>
        <div class="form-group">
          <label for="intelligence">INT</label>
          <input type="number" id="intelligence" formControlName="intelligence">
        </div>
        <div class="form-group">
          <label for="wisdom">WIS</label>
          <input type="number" id="wisdom" formControlName="wisdom">
        </div>
        <div class="form-group">
          <label for="charisma">CHA</label>
          <input type="number" id="charisma" formControlName="charisma">
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" (click)="onCancel()">Cancel</button>
        <button type="submit" [disabled]="characterForm.invalid">Save</button>
      </div>
    </form>
  </div>
</div>
