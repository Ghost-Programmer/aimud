<div class="dashboard-container">
  <div class="status-bar">
    <div class="status-group">
      <div class="status-item">
        <span class="label">Role:</span>
        <span class="value">{{ role }}</span>
      </div>
      <div class="status-item">
        <span class="label">Local Time:</span>
        <span class="value">{{ localTime }}</span>
      </div>
      <div class="status-item">
        <span class="label">Online Time:</span>
        <span class="value">{{ onlineTime }}</span>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()">Logout</button>
  </div>

  <div class="tabs-container">
    <div class="tabs-header">
      <div
        *ngFor="let tab of tabs"
        class="tab-button"
        [class.active]="activeTabId === tab.id"
        (click)="setActiveTab(tab.id)">
        {{ tab.label }}
        <span *ngIf="tab.type === 'play-character'" class="close-tab" (click)="closeTab(tab.id, $event)">×</span>
      </div>
    </div>

    <div class="tab-content">
      <ng-container *ngFor="let tab of tabs">
        <div *ngIf="activeTabId === tab.id">
          <div *ngIf="tab.type === 'create-character'">
            <h2>Create Character</h2>
            <app-create-character></app-create-character>
          </div>
          <div *ngIf="tab.type === 'select-character'">
            <app-character-select (characterSelected)="onCharacterSelected($event, tab.id)"></app-character-select>
          </div>
          <div *ngIf="tab.type === 'play-character'">
            <app-character-play [character]="tab.data"></app-character-play>
          </div>
          <div *ngIf="tab.type === 'players'">
            <h2>Players Management</h2>
            <app-player-list></app-player-list>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
