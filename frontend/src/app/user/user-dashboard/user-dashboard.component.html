<div class="dashboard-container">

    <!-- Top Navigation Bar -->
    <nav class="dashboard-nav">
        <div class="nav-brand">
            <h1>AI MUD <span class="accent-text">Network</span></h1>
        </div>

        <div class="nav-profile">
            <div class="profile-info">
                <span class="username">{{ username }}</span>
                <span class="role-badge" [ngClass]="{'admin-badge': isAdmin}">
                    {{ isAdmin ? 'ADMIN' : 'PLAYER' }}
                </span>
            </div>
            <img [src]="gravatarUrl" alt="Operator Icon" class="profile-pic">
        </div>
    </nav>

    <!-- Main Dashboard Body -->
    <div class="dashboard-content">

        <div class="glass-panel profile-panel">
            <div class="panel-header">
                <h2>Operator Core</h2>
                <p>Access level verified</p>
            </div>

            <div class="dashboard-actions">

                <button class="cyber-button secondary action-btn" (click)="changePassword()">
                    <span class="btn-text">Update Protocol (PassKey)</span>
                    <div class="btn-glow"></div>
                </button>

                <button *ngIf="isAdmin" class="cyber-button primary action-btn admin-btn" (click)="adminPanel()">
                    <span class="btn-text">Admin Override Access</span>
                    <div class="btn-glow"></div>
                </button>

                <button class="cyber-button warning action-btn" (click)="logout()">
                    <span class="btn-text">Disconnect Node (Logout)</span>
                    <div class="btn-glow"></div>
                </button>

            </div>
        </div>

    </div>
</div>
