<div class="dashboard-container">
  <div class="status-bar">
    <div class="status-item">
      <span class="label">Role:</span>
      <span class="value">{{ role }}</span>
    </div>
    <div class="status-item">
      <span class="label">Local Time:</span>
      <span class="value">{{ localTime }}</span>
    </div>
    <div class="status-item">
      <span class="label">Online Time:</span>
      <span class="value">{{ onlineTime }}</span>
    </div>
  </div>

  <div class="tabs-container">
    <div class="tabs-header">
      <button
        class="tab-button"
        [class.active]="activeTab === 'create-character'"
        (click)="setActiveTab('create-character')">
        Create Character
      </button>
      <button
        *ngIf="role === 'MUD_ADMIN'"
        class="tab-button"
        [class.active]="activeTab === 'players'"
        (click)="setActiveTab('players')">
        Players
      </button>
    </div>

    <div class="tab-content">
      <div *ngIf="activeTab === 'create-character'">
        <h2>Create Character</h2>
        <p>Character creation form will go here.</p>
      </div>
      <div *ngIf="activeTab === 'players'">
        <h2>Players Management</h2>
        <p>List of players will go here.</p>
      </div>
    </div>
  </div>
</div>
