<main class="main-container" *ngIf="router.url === '/'">
  <!-- Show loading state if settings aren't loaded -->
  <div *ngIf="!settingsLoaded" class="glass-panel loading-state">
    <div class="spinner"></div>
    <p>Connecting to Server...</p>
  </div>

  <div *ngIf="settingsLoaded" class="app-content">

    <!-- Maintenance Screen -->
    <div *ngIf="maintenance" class="glass-panel maintenance-mode">
      <div class="icon-warning">⚠️</div>
      <h1 class="glow-text">System Offline</h1>
      <p class="maintenance-text">{{ maintenanceText }}</p>
    </div>

    <!-- Active Login Screen -->
    <div *ngIf="!maintenance" class="glass-panel active-mode">
      <h1 class="glow-text title">{{ serverName }}</h1>
      <p class="subtitle">Welcome to the adventure.</p>

      <div class="action-buttons">
        <button class="btn btn-primary" (click)="openLoginDialog()">Login</button>
        <button *ngIf="allowNewUser" class="btn btn-secondary" (click)="openRegisterDialog()">Create new User</button>
      </div>
    </div>

    <!-- Server Status Footer Card -->
    <div class="glass-panel status-footer">
      <div class="status-header">
        <h2>System Status</h2>
        <div class="status-indicator">
          <span class="status-dot" [class.online]="backendStatus === 'ONLINE'"></span>
          <span class="status-text" [class.online-text]="backendStatus === 'ONLINE'">
            {{ backendStatus || 'CONNECTING...' }}
          </span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="status-grid">
        <div class="status-item">
          <span class="label">Version</span>
          <span class="value">{{ backendVersion || '---' }}</span>
        </div>
        <div class="status-item">
          <span class="label">Uptime</span>
          <span class="value">{{ backendUptime || '---' }}</span>
        </div>
        <div class="status-item">
          <span class="label">Database</span>
          <span class="value">{{ backendDatabase || '---' }}</span>
        </div>
      </div>
    </div>
  </div>
</main>

<app-register-dialog *ngIf="isRegisterDialogOpen" (closeDialog)="closeRegisterDialog()"></app-register-dialog>
<app-login-dialog *ngIf="isLoginDialogOpen" (closeDialog)="closeLoginDialog()"></app-login-dialog>
<router-outlet />
