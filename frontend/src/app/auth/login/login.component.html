<div class="auth-container">
    <div class="glass-panel">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Login to your operator dashboard</p>
        </div>

        <div *ngIf="successMessage" class="success-message">
            {{ successMessage }}
        </div>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required class="glass-input"
                    placeholder="Enter your email" [disabled]="isLoading">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" required class="glass-input"
                    placeholder="Enter your password" [disabled]="isLoading">
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <button type="submit" class="cyber-button primary action-btn"
                [disabled]="isLoading || !loginForm.form.valid">
                <span class="btn-text">{{ isLoading ? 'Verifying...' : 'Access Terminal' }}</span>
                <div class="btn-glow"></div>
            </button>

        </form>

        <div class="auth-footer">
            <p>Need an account? <a routerLink="/register" class="text-link">Register here</a></p>
            <p>Or return to <a routerLink="/" class="text-link">Home</a></p>
        </div>
    </div>
</div>
