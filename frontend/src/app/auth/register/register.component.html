<div class="auth-container">
    <div class="glass-panel">
        <div class="auth-header">
            <h2>Create Account</h2>
            <p>Join the AI MUD universe</p>
        </div>

        <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="auth-form">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required class="glass-input"
                    placeholder="Enter your email" [disabled]="isLoading">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" required class="glass-input"
                    placeholder="Create a password" [disabled]="isLoading">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword"
                    required class="glass-input" placeholder="Confirm your password" [disabled]="isLoading">
            </div>

            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <button type="submit" class="cyber-button primary action-btn"
                [disabled]="isLoading || !registerForm.form.valid">
                <span class="btn-text">{{ isLoading ? 'Registering...' : 'Sign Up' }}</span>
                <div class="btn-glow"></div>
            </button>

        </form>

        <div class="auth-footer">
            <p>Already have an account? <a routerLink="/login" class="text-link">Login here</a></p>
            <p>Or return to <a routerLink="/" class="text-link">Home</a></p>
        </div>
    </div>
</div>
