services:
  postgres:
    image: postgres:16
    container_name: aimud-db
    environment:
      POSTGRES_USER: aimud
      POSTGRES_PASSWORD: aimud_password
      POSTGRES_DB: aimud
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
