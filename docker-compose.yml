services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aimud-db
    environment:
      POSTGRES_USER: aimud
      POSTGRES_PASSWORD: aimud_password
      POSTGRES_DB: aimud
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  aimud:
    build: .
    container_name: aimud-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/aimud
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://postgres:5432/aimud
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aimud
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SPRING_DOCKER_COMPOSE_ENABLED=false
    depends_on:
      - postgres
      - ollama
      
  ollama:
    image: ollama/ollama:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull llama3.2
        ollama pull hermes3
        ollama pull nomic-embed-text
        wait
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
volumes:
  postgres-data:
  ollama-data:
  open-webui:
