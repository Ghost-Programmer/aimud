services:
  postgres:
    image: postgres:16
    container_name: aimud-db
    environment:
      POSTGRES_USER: aimud
      POSTGRES_PASSWORD: aimud_password
      POSTGRES_DB: aimud
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull llama3.1
        wait

volumes:
  postgres-data:
  ollama-data:
